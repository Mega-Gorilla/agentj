[package]
name = "vdesk"
version = "0.1.0"
edition = "2024"
description = "OpenDeck plugin: switch Windows 11 virtual desktops from a Stream Deck"
publish = false

[dependencies]
openaction = "2.8"
winvd = "0.0.49"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"
base64 = "0.22"
# same major as winvd uses, so only one copy gets built
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = true
strip = true

[package]
name = "agentj"
version = "0.1.0"
edition = "2024"
description = "AgentJ: see your Claude Code and Codex sessions on a Stream Deck and jump to them (OpenDeck plugin)"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
openaction = "2.8"
winvd = "0.0.49"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: installing hooks must not reorder the user's settings file
serde_json = { version = "1", features = ["preserve_order"] }
log = "0.4"
simplelog = "0.12"
base64 = "0.22"
# same major as winvd uses, so only one copy gets built
windows = { version = "0.58", features = [
	"Win32_Foundation",
	"Win32_System_Com",
	"Win32_System_Threading",
	"Win32_UI_Accessibility",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true
